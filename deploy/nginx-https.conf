# 替换现有 shining-star 站点配置使用，不要同时启用两份缓存配置。
proxy_cache_path /var/cache/nginx/shining-star
    levels=1:2 keys_zone=invitation_pages:10m
    max_size=200m inactive=30m use_temp_path=off;

map $uri $skip_page_cache {
    default 1;
    "~^/[a-z0-9]+(?:-[a-z0-9]+)*$" 0;
}

map "$request_method:$args:$http_cookie:$http_authorization" $skip_request_cache {
    default 1;
    "~^(GET|HEAD):::$" 0;
}

server {
    listen 80;
    server_name minvitation.site www.minvitation.site;
    return 301 https://minvitation.site$request_uri;
}

server {
    listen 443 ssl;
    server_name minvitation.site www.minvitation.site;

    ssl_certificate /etc/nginx/ssl/minvitation.site/minvitation.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/minvitation.site/minvitation.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:invitation_tls:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache invitation_pages;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_bypass $skip_page_cache $skip_request_cache;
        proxy_no_cache $skip_page_cache $skip_request_cache $upstream_http_set_cookie;
        add_header X-Cache $upstream_cache_status always;
    }
}
