name: shining-star
services:
  app:
    image: shining-star:latest
    pull_policy: never
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      DATABASE_PATH: /data/app.db
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - type: bind
        source: /var/lib/invitation
        target: /data
        bind:
          create_host_path: false
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
